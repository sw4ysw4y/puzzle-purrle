<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cute Cat 3x3 Puzzle</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff0f5 0%, #ffe4ec 50%, #fdf6e9 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #4a3b42;
      padding: 16px;
      overflow-x: hidden;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
      color: #d65a84;
      text-align: center;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 14px;
      font-weight: 600;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.8);
      padding: 8px 18px;
      border-radius: 999px;
      box-shadow: 0 4px 12px rgba(214, 90, 132, 0.12);
    }

    .board-wrapper {
      position: relative;
      width: min(88vw, 420px);
      height: min(88vw, 420px);
      background: #f5dce4;
      padding: 8px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(180, 90, 120, 0.22);
    }

    .board {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
      transition: gap 0.5s ease;
    }

    .board.solved {
      gap: 0px;
    }

    .tile {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-radius 0.5s ease;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
    }

    .board.solved .tile {
      border-radius: 0px;
      box-shadow: none;
      cursor: default;
    }

    .tile:hover:not(.empty):not(.solved-tile) {
      transform: scale(0.97);
    }

    /* Slight scale (1.07) cleanly hides thin white borders around the PNGs without canvas CORS issues */
    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.07);
      display: block;
      pointer-events: none;
    }

    .tile.empty {
      background: rgba(255, 255, 255, 0.35);
      box-shadow: inset 0 2px 6px rgba(180, 90, 120, 0.18);
      cursor: default;
    }

    .tile.empty img {
      opacity: 0;
      transform: scale(0.3);
    }

    /* Reveal animation for bottom right.png when solved */
    .tile.reveal-final img {
      animation: popIn 0.65s cubic-bezier(0.22, 1.35, 0.36, 1) forwards;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.2) rotate(-12deg);
      }
      70% {
        opacity: 1;
        transform: scale(1.14) rotate(2deg);
      }
      100% {
        opacity: 1;
        transform: scale(1.07) rotate(0deg);
      }
    }

    .tile-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(255, 255, 255, 0.85);
      color: #c24b75;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .board.solved .tile-badge,
    .hide-numbers .tile-badge {
      opacity: 0;
    }

    .peek-overlay {
      position: absolute;
      inset: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      border-radius: 12px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 10;
    }

    .peek-overlay.active {
      opacity: 1;
    }

    .peek-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.07);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: none;
      background: #e56b95;
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(229, 107, 149, 0.3);
      transition: transform 0.12s ease, background 0.15s ease;
    }

    button:hover {
      background: #d45581;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
    }

    button.secondary {
      background: #ffffff;
      color: #c24b75;
      border: 2px solid #f3bfd1;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    button.secondary:hover {
      background: #fff5f8;
    }

    .win-banner {
      margin-top: 14px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #c24b75;
      background: #ffffff;
      padding: 10px 22px;
      border-radius: 999px;
      box-shadow: 0 6px 18px rgba(214, 90, 132, 0.2);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
    }

    .win-banner.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <h1>🎀 Cute Cat Puzzle 🎀</h1>

  <div class="stats">
    <span>Moves: <strong id="move-count">0</strong></span>
    <span>Time: <strong id="timer">00:00</strong></span>
  </div>

  <div class="board-wrapper">
    <div class="board" id="board"></div>
    <div class="peek-overlay" id="peek-overlay"></div>
  </div>

  <div class="win-banner" id="win-banner">🎉 Purr-fect! You solved it! 🎉</div>

  <div class="controls">
    <button id="shuffle-btn">🔀 Shuffle</button>
    <button class="secondary" id="peek-btn">👀 Hold to Peek</button>
    <button class="secondary" id="numbers-btn">🔢 Hide Numbers</button>
  </div>

  <script>
    // Exact filenames in the same folder
    const TILE_FILES = [
      "top left.png",
      "top middle.png",
      "top right.png",
      "middle left.png",
      "middle.png",
      "middle right.png",
      "bottom left.png",
      "bottom middle.png",
      "bottom right.png" // Index 8: hidden until solved!
    ];

    const EMPTY_ID = 8; // Bottom-right piece
    let grid = [0, 1, 2, 3, 4, 5, 6, 7, 8];
    let moves = 0;
    let seconds = 0;
    let timerInterval = null;
    let isSolved = false;
    let showNumbers = true;

    const boardEl = document.getElementById("board");
    const peekEl = document.getElementById("peek-overlay");
    const moveCountEl = document.getElementById("move-count");
    const timerEl = document.getElementById("timer");
    const winBannerEl = document.getElementById("win-banner");
    const shuffleBtn = document.getElementById("shuffle-btn");
    const peekBtn = document.getElementById("peek-btn");
    const numbersBtn = document.getElementById("numbers-btn");

    // Populate peek preview overlay
    TILE_FILES.forEach((src) => {
      const img = document.createElement("img");
      img.src = src;
      peekEl.appendChild(img);
    });

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        seconds++;
        timerEl.textContent = formatTime(seconds);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function checkWin() {
      for (let i = 0; i < 9; i++) {
        if (grid[i] !== i) return false;
      }
      return true;
    }

    function renderBoard(justSolved = false) {
      boardEl.innerHTML = "";
      boardEl.classList.toggle("solved", isSolved);
      boardEl.classList.toggle("hide-numbers", !showNumbers);

      grid.forEach((tileId, index) => {
        const tile = document.createElement("div");
        tile.className = "tile";

        const isBottomRightPiece = tileId === EMPTY_ID;

        if (isBottomRightPiece && !isSolved) {
          tile.classList.add("empty");
        } else if (isSolved) {
          tile.classList.add("solved-tile");
          if (isBottomRightPiece && justSolved) {
            tile.classList.add("reveal-final");
          }
        }

        const img = document.createElement("img");
        img.src = TILE_FILES[tileId];
        img.alt = `Piece ${tileId + 1}`;
        tile.appendChild(img);

        if (!isBottomRightPiece) {
          const badge = document.createElement("span");
          badge.className = "tile-badge";
          badge.textContent = tileId + 1;
          tile.appendChild(badge);
        }

        tile.addEventListener("click", () => handleTileClick(index));
        boardEl.appendChild(tile);
      });
    }

    function getNeighbors(index) {
      const row = Math.floor(index / 3);
      const col = index % 3;
      const neighbors = [];
      if (row > 0) neighbors.push(index - 3);
      if (row < 2) neighbors.push(index + 3);
      if (col > 0) neighbors.push(index - 1);
      if (col < 2) neighbors.push(index + 1);
      return neighbors;
    }

    function handleTileClick(index) {
      if (isSolved) return;

      const emptyIndex = grid.indexOf(EMPTY_ID);
      const validMoves = getNeighbors(emptyIndex);

      if (validMoves.includes(index)) {
        if (moves === 0) startTimer();

        // Swap clicked tile with empty space
        [grid[index], grid[emptyIndex]] = [grid[emptyIndex], grid[index]];
        moves++;
        moveCountEl.textContent = moves;

        if (checkWin()) {
          isSolved = true;
          stopTimer();
          renderBoard(true);
          winBannerEl.classList.add("visible");
          launchConfetti();
        } else {
          renderBoard(false);
        }
      }
    }

    // Keyboard arrow support
    window.addEventListener("keydown", (e) => {
      if (isSolved) return;
      const emptyIndex = grid.indexOf(EMPTY_ID);
      const row = Math.floor(emptyIndex / 3);
      const col = emptyIndex % 3;
      let targetIndex = -1;

      if (e.key === "ArrowUp" && row < 2) targetIndex = emptyIndex + 3;
      if (e.key === "ArrowDown" && row > 0) targetIndex = emptyIndex - 3;
      if (e.key === "ArrowLeft" && col < 2) targetIndex = emptyIndex + 1;
      if (e.key === "ArrowRight" && col > 0) targetIndex = emptyIndex - 1;

      if (targetIndex !== -1) {
        e.preventDefault();
        handleTileClick(targetIndex);
      }
    });

    // Shuffle by performing valid random moves so the puzzle is 100% solvable
    function shufflePuzzle() {
      stopTimer();
      isSolved = false;
      moves = 0;
      seconds = 0;
      moveCountEl.textContent = "0";
      timerEl.textContent = "00:00";
      winBannerEl.classList.remove("visible");

      grid = [0, 1, 2, 3, 4, 5, 6, 7, 8];
      let emptyIndex = 8;
      let lastEmpty = -1;

      for (let i = 0; i < 120; i++) {
        const neighbors = getNeighbors(emptyIndex).filter((n) => n !== lastEmpty);
        const nextIndex = neighbors[Math.floor(Math.random() * neighbors.length)];
        [grid[emptyIndex], grid[nextIndex]] = [grid[nextIndex], grid[emptyIndex]];
        lastEmpty = emptyIndex;
        emptyIndex = nextIndex;
      }

      // Ensure it didn't accidentally end up solved
      if (checkWin()) {
        shufflePuzzle();
        return;
      }

      renderBoard(false);
    }

    // Peek button events (mouse + touch)
    peekBtn.addEventListener("mousedown", () => peekEl.classList.add("active"));
    peekBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      peekEl.classList.add("active");
    });
    const endPeek = () => peekEl.classList.remove("active");
    window.addEventListener("mouseup", endPeek);
    window.addEventListener("touchend", endPeek);

    numbersBtn.addEventListener("click", () => {
      showNumbers = !showNumbers;
      numbersBtn.textContent = showNumbers ? "🔢 Hide Numbers" : "🔢 Show Numbers";
      boardEl.classList.toggle("hide-numbers", !showNumbers);
    });

    shuffleBtn.addEventListener("click", shufflePuzzle);

    // Confetti celebration
    function launchConfetti() {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ["#ff6b9d", "#ffd166", "#06d6a0", "#4cc9f0", "#f72585", "#ffb5a7"];
      const particles = Array.from({ length: 140 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        w: Math.random() * 10 + 6,
        h: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - 0.5) * 4,
        vy: Math.random() * 4 + 3,
        rot: Math.random() * 360,
        vRot: (Math.random() - 0.5) * 10
      }));

      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vRot;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        frame++;
        if (frame < 180) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      animate();
    }

    // Start shuffled on load
    shufflePuzzle();
  </script>
</body>
</html>
